<!doctype html>
<!-- README 示意图的源文件。用无头浏览器导出 PNG：
     msedge --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,560 --screenshot=preview.png preview.html
     壁纸和图标都是 CSS/SVG 画的通用图形，不是真实截图。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TaskbarClear 示意图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 560px; background: #0f1720; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; overflow: hidden; }
  .row { position: relative; height: 272px; margin: 0 0 16px; overflow: hidden; }
  .row:last-child { margin-bottom: 0; }
  /* 模拟壁纸：黄昏天空 + 三层山 */
  .wall { position: absolute; inset: 0; background: linear-gradient(180deg, #2b3a67 0%, #5a5f9a 35%, #c77d8c 68%, #f2b37a 100%); }
  .wall svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .label { position: absolute; left: 20px; top: 16px; padding: 6px 14px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  .label small { font-weight: 400; opacity: .8; margin-left: 8px; font-size: 14px; }
  .tag { position: absolute; right: 20px; top: 18px; color: rgba(255,255,255,.75); font-size: 13px; }
  /* 任务栏 */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; color: #fff; }
  .bar.default { background: #202020; }
  .bar.clear { background: transparent; }
  .start { width: 48px; height: 40px; display: grid; place-items: center; }
  .start i { display: grid; grid-template-columns: 7px 7px; gap: 2px; }
  .start i b { width: 7px; height: 7px; background: #fff; display: block; }
  .search { width: 344px; height: 40px; background: #f3f3f3; color: #555; display: flex; align-items: center; padding-left: 12px; font-size: 14px; gap: 10px; }
  .search svg { width: 16px; height: 16px; }
  .apps { display: flex; height: 40px; }
  .app { width: 48px; height: 40px; display: grid; place-items: center; position: relative; }
  .app.on::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 0; height: 2px; background: #9ecbff; }
  .app.active { background: rgba(255,255,255,.12); }
  .app svg { width: 24px; height: 24px; }
  .tray { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-right: 10px; font-size: 12px; }
  .tray svg { width: 16px; height: 16px; }
  .clock { text-align: center; line-height: 1.3; }
  .clear .app.active { background: rgba(255,255,255,.18); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="hills" viewBox="0 0 1200 272" preserveAspectRatio="none">
      <path d="M0 150 L120 110 L230 140 L360 80 L470 130 L600 95 L720 140 L850 70 L980 125 L1090 100 L1200 130 L1200 272 L0 272Z" fill="#6b5b8f" opacity=".85"/>
      <path d="M0 190 L150 150 L300 185 L420 140 L560 180 L700 150 L840 190 L980 150 L1100 175 L1200 160 L1200 272 L0 272Z" fill="#4a4370"/>
      <path d="M0 205 L180 180 L330 200 L500 176 L680 202 L860 180 L1020 200 L1200 184 L1200 272 L0 272Z" fill="#2c2848"/>
      <circle cx="930" cy="120" r="34" fill="#ffd9a0" opacity=".9"/>
      <!-- 前景湖面：让任务栏所在的位置色彩明亮，透明效果更明显 -->
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6b583"/><stop offset=".5" stop-color="#e38b8f"/><stop offset="1" stop-color="#8a6fb3"/>
      </linearGradient>
      <rect x="0" y="212" width="1200" height="60" fill="url(#lake)"/>
      <rect x="880" y="216" width="100" height="4" rx="2" fill="#ffe6c2" opacity=".9"/>
      <rect x="895" y="228" width="70" height="3" rx="1.5" fill="#ffe6c2" opacity=".75"/>
      <rect x="905" y="240" width="50" height="3" rx="1.5" fill="#ffe6c2" opacity=".6"/>
      <rect x="912" y="252" width="36" height="2" rx="1" fill="#ffe6c2" opacity=".5"/>
      <rect x="918" y="262" width="24" height="2" rx="1" fill="#ffe6c2" opacity=".4"/>
    </symbol>
    <!-- 通用图标：文件夹、浏览器、终端、编辑器、音乐、设置 -->
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#f4c542"/><path d="M2 9h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#ffd866"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#3d8bfd"/><path d="M2 12h20M12 2c3 3 3 17 0 20M12 2c-3 3-3 17 0 20" stroke="#fff" stroke-width="1.4" fill="none"/></symbol>
    <symbol id="i-term" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" fill="#2d2d2d" stroke="#8a8a8a"/><path d="M6 9l3 3-3 3M11 15h6" stroke="#7CFC9A" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4" fill="#7b5cff"/><path d="M9 8l-4 4 4 4M15 8l4 4-4 4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="10" fill="#ff5c7a"/><path d="M10 16V8l6-1.5v8" stroke="#fff" stroke-width="1.8" fill="none"/><circle cx="9" cy="16" r="2" fill="#fff"/><circle cx="15" cy="14.5" r="2" fill="#fff"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#6c7a89"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="#fff" stroke-width="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 16 16"><path d="M1 6a10 10 0 0 1 14 0M3.5 8.5a6.5 6.5 0 0 1 9 0M6 11a3 3 0 0 1 4 0" stroke="#fff" stroke-width="1.4" fill="none"/><circle cx="8" cy="13.5" r="1" fill="#fff"/></symbol>
    <symbol id="i-vol" viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#fff"/><path d="M11 5a4 4 0 0 1 0 6" stroke="#fff" stroke-width="1.4" fill="none"/></symbol>
  </defs>
</svg>

<template id="bar">
  <div class="start"><i><b></b><b></b><b></b><b></b></i></div>
  <div class="search"><svg><use href="#i-search"/></svg>在这里输入你要搜索的内容</div>
  <div class="apps">
    <div class="app on"><svg><use href="#i-folder"/></svg></div>
    <div class="app on active"><svg><use href="#i-globe"/></svg></div>
    <div class="app on"><svg><use href="#i-term"/></svg></div>
    <div class="app"><svg><use href="#i-code"/></svg></div>
    <div class="app"><svg><use href="#i-music"/></svg></div>
    <div class="app"><svg><use href="#i-gear"/></svg></div>
  </div>
  <div class="tray">
    <span>^</span><svg><use href="#i-wifi"/></svg><svg><use href="#i-vol"/></svg><span>中</span>
    <div class="clock">16:20<br>2026/11/9</div>
  </div>
</template>

<div class="row">
  <div class="wall"><svg><use href="#hills"/></svg></div>
  <div class="label">系统默认<small>Default</small></div>
  <div class="tag">示意图 · Illustration</div>
  <div class="bar default"></div>
</div>
<div class="row">
  <div class="wall"><svg><use href="#hills"/></svg></div>
  <div class="label">TaskbarClear<small>完全透明 · Fully transparent</small></div>
  <div class="bar clear"></div>
</div>

<script>
  const t = document.getElementById('bar');
  document.querySelectorAll('.bar').forEach(b => b.appendChild(t.content.cloneNode(true)));
</script>
</body>
</html>
